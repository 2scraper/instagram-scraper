name: canary

on:
  schedule:
    - cron: "41 6 * * *"   # once daily; avoid :00 so it doesn't pile up with everyone else's
  workflow_dispatch: {}     # dispatch manually at least once before trusting the badge

jobs:
  # A real run: one public profile and its 3 most recent posts, through a
  # residential proxy, with a local Playwright Chromium. A GitHub runner is
  # a datacentre address, and Instagram answers distrusted addresses with
  # its login page — so without the INSTAGRAM_PROXY secret this job SKIPS
  # with a notice rather than going red every day.
  #
  # `vars.INSTAGRAM_CANARY_ACCOUNT` overrides the account (default natgeo).
  # Blocked, empty, partial and remote-error outcomes are red.
  canary:
    runs-on: ubuntu-latest
    env:
      HAS_PROXY: ${{ secrets.INSTAGRAM_PROXY != '' }}
      CANARY_ACCOUNT: ${{ vars.INSTAGRAM_CANARY_ACCOUNT || 'natgeo' }}
      INSTAGRAM_PROXY: ${{ secrets.INSTAGRAM_PROXY }}
    steps:
      - uses: actions/checkout@v4

      - name: Skip — no INSTAGRAM_PROXY secret configured
        if: env.HAS_PROXY != 'true'
        run: |
          echo "::notice::Skipping: no INSTAGRAM_PROXY secret. Set it (a residential \
          http://login:password@host:port proxy) as a repo secret to turn the canary on. \
          This is a SKIP, not a pass or a fail."

      - uses: actions/setup-python@v5
        if: env.HAS_PROXY == 'true'
        with:
          python-version: "3.12"
      - name: Install Playwright and Chromium
        if: env.HAS_PROXY == 'true'
        run: |
          pip install -r requirements-playwright.txt
          playwright install --with-deps chromium

      # The proxy reaches the scraper through the environment only, never
      # argv (env_config.py reads INSTAGRAM_PROXY).
      - name: One profile and its 3 most recent posts
        if: env.HAS_PROXY == 'true'
        run: |
          set +e
          python3 playwright_scraper.py --url "$CANARY_ACCOUNT" --posts 3 \
            --format json --out canary.json --dump-html
          echo "canary_exit=$?" >> "$GITHUB_ENV"

      - name: Require a complete run with full rows
        if: env.HAS_PROXY == 'true'
        run: |
          python3 -c "
          import json, os
          code = int(os.environ['canary_exit'])
          print(f'exit {code}')
          if code != 0:
              raise SystemExit(f'canary requires EXIT_OK=0, got {code}')
          meta = json.load(open('canary.json.meta.json'))
          print(json.dumps(meta, indent=2))
          assert meta['status'] == 'complete' and meta['pages_completed'] == 4, meta
          rows = json.load(open('canary.json'))
          profiles = [r for r in rows if r['category'] == 'profile']
          posts = [r for r in rows if r['category'] == 'post']
          assert len(profiles) == 1 and len(posts) == 3, [r['sku'] for r in rows]
          p = profiles[0]
          # Only the embedded profile object fills these; a regression to a
          # data-less shell or an og:-tag guess shows up here first.
          assert p['sku'].startswith('instagram-user-') and p['follower_count'] and p['follower_count'] > 1000, p
          assert len(json.loads(p['recent_posts_json'])) == 12, p
          for r in posts:
              assert r['sku'].startswith('instagram-post-') and r['posted_at'] and r['media_type'], r
              assert r['comment_count'] is not None and (r['like_count'] is not None or r['likes_hidden']), r
              assert r['username'] == p['username'], r
          print('canary: OK')
          "

      - name: Upload artifacts on every non-skipped run
        if: always() && env.HAS_PROXY == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: canary-${{ github.run_id }}
          path: |
            canary*.json
            canary_debug_*.html
          retention-days: 14
