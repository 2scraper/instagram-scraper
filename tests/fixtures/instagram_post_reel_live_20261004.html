out the lives of Africa’s smallest crocodiles at the link in bio.\n\nThrough its partnership with the National Geographic Society and as part of its Perpetual Planet Initiative, #Rolex supports expeditions exploring and protecting remarkable places around the world, a selection of which are featured in #AfricaEarthsWildHome. #PerpetualPlanet\n\nPhotograph by @hammond_robin\n\nAfrica Earth’s Wild Home premieres Friday, October 2 at 8/7c on @NatGeoTV. Streaming next day on @DisneyPlus and @hulu."},"code":"DeAZ0uAgNuA","seo_canonical_url":null,"display_uri":"https://scontent.cdninstagram.com/v/t51.82787-15/829585622_18703580971019133_8641374472154578532_n.jpg?stp=dst-jpg_e35_s640x640_tt6&_nc_cat=1&ccb=7-5&_nc_sid=18de74&efg=eyJlZmdfdGFnIjoiRkVFRC5iZXN0X2ltYWdlX3VybGdlbi5DMyJ9&_nc_ohc=SnM9xycPrJMQ7kNvwGmr-Rz&_nc_oc=AdrvBHCVAsn5OQfbBlAI4c3fFZjwIE2n1ve93w2iRksMDQmGs_0U2kf5LOfNNGE6GsI&_nc_zt=23&_nc_ht=scontent.cdninstagram.com&_nc_gid=EOllPi5UWjUfwaeR8xocpg&_nc_ss=70689&oh=00_AQPzpDkguGZ9upHxArRboQnaF52ZSA81YXosKSO-ND7iJA&oe=6AC7E921","media_type":1,"product_type":"feed","user":{"pk":"787132","username":"natgeo","id":"17841400573960012"},"id":"POLARIS_3999310043081137024"}},{"node":{"__typename":"XIGPolarisImageMedia","pk":"3999226761241700599","__isXIGPolarisMedia":"XIGPolarisImageMedia","accessibility_caption":"Photo by National Geographic on October 02, 2026. May be an image of elephant, rhinoceros, magazine, poster and text.","caption":{"text":"In just the last 50 years, Africa’s wildlife population has dwindled by nearly 80 percent—a nearly unimaginable loss for a continent that remains one of the world’s last great strongholds for animal abundance. Can the tide turn? \n\nIn a special cover package for our new October issue, out now, we meet the people refusing to accept this decline as inevitable. The team puzzling over how to move 2,000 enormous rhinos; the conservationists protecting the world’s most trafficked mammal, and the problem-solvers trying to save teeny-tiny crocodiles, bone-eating birds, and majestic gorillas.\n\nElsewhere in the magazine, we investigate the mounting toll of extreme heat on pregnant women and their babies. We take NASA's new Artemis moon rovers for a spin. And we trace the unlikely rise of the jellyfish as a new superfood.\n\nIf this sparked your curiosity, there's more waiting—subscribe to Nat Geo at the link in bio."},"code":"DeAG4zwDCj3","seo_canonical_url":null,"display_uri":"https://scontent.cdninstagram.com/v/t51.82787-15/830966638_18703533814019133_965502521595117335_n.jpg?stp=dst-jpg_e35_s640x640_tt6&_nc_cat=110&ccb=7-5&_nc_sid=18de74&efg=eyJlZmdfdGFnIjoiRkVFRC5iZXN0X2ltYWdlX3VybGdlbi5DMyJ9&_nc_ohc=wQveF8GVBNUQ7kNvwEVv7Lc&_nc_oc=Ado3tczOhvonWSFus_fOTFzPq46HEet1R91dj5v0HErmshFB5xVuJGTRXJaS2d7hhWs&_nc_zt=23&_nc_ht=scontent.cdninstagram.com&_nc_gid=EOllPi5UWjUfwaeR8xocpg&_nc_ss=70689&oh=00_AQMyYrsqNLs6W-YgwF8h4RB015qVm3q3hHzv3ecXBBSkoQ&oe=6AC7F3CD","media_type":1,"product_type":"feed","user":{"pk":"787132","username":"natgeo","id":"17841400573960012"},"id":"POLARIS_3999226761241700599"}},{"node":{"__typename":"XIGPolarisVideoMedia","pk":"3999067523172763307","__isXIGPolarisMedia":"XIGPolarisVideoMedia","accessibility_caption":"Video by National Geographic on October 02, 2026. May be an image of animal and text.","caption":{"text":"Presented by @Rolex. A simple branch becomes a fishing rod in the hands of these resourceful chimpanzees. This technique allows them to harvest algae without getting wet. \n\nThrough its partnership with the National Geographic Society and as part of its Perpetual Planet Initiative, #Rolex supports expeditions exploring and protecting remarkable places around the world, a selection of which are featured in Africa Earth’s Wild Home. #PerpetualPlanet\n\n#AfricaEarthsWildHome premieres tonight at 8/7c on National Geographic. Streaming tomorrow on @DisneyPlus and @hulu."},"code":"Dd_irlvg4ar","seo_canonical_url":null,"display_uri":"https://scontent.cdninstagram.com/v/t51
